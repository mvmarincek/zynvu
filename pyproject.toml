[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zynvu"
version = "0.3.0"
description = "Local-first AI architecture advisor and SDK"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4,<0.2", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema", "types-psutil", "build>=1.2,<2"]

[project.scripts]
zynvu = "zynvu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zynvu = ["data/*.json", "ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
